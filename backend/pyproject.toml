[project]
name = "juryai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    # Retrieval
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    # Parsing — structured markdown extraction (headings/tables/lists) per page
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    # OCR for scanned/image-only PDFs and standalone image uploads (needs
    # system tesseract + poppler)
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    # Pillow: used directly for standalone image OCR (was previously only a
    # transitive dep of pdf2image/pymupdf)
    "pillow>=10.0.0",
    # Excel ingestion
    "openpyxl>=3.1.0",
    # PDF / DOCX generation and DOCX upload parsing
    "fpdf2>=2.7.0",
    "python-docx>=1.1.0",
    # Cache / memory store — Valkey via redis-py (wire-compatible client)
    "redis>=8.0.0",
    # Durable audit log — Postgres via SQLAlchemy 2.x async + asyncpg
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Graph orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # Web search (free fallback first)
    "ddgs>=9.0.0",
    "tavily-python>=0.3.0",
    # HTTP
    "httpx>=0.27.0",
    # Process CPU sampling — ingestion concurrency governor
    "psutil>=6.0.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
]
superior = [
    "onnxruntime>=1.18.0",
    "colbert-ai>=0.2.11",
    "torch>=2.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
