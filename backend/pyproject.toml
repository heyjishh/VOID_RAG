[project]
name = "juryai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    # Retrieval
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    # Parsing
    "pymupdf>=1.24.0",
    # LLM routing
    "litellm>=1.43.0",
    # Cache / memory store — Valkey via redis-py (wire-compatible client)
    "redis>=8.0.0",
    # Durable audit log — Postgres via SQLAlchemy 2.x async + asyncpg
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Graph orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # Web search (free fallback first)
    "ddgs>=9.0.0",
    "tavily-python>=0.3.0",
    # HTTP
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
