version: '3.8'

services:
  # PostgreSQL for audit logs and metadata
  postgres:
    image: pgvector/pgvector:pg16
    container_name: voidrag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: juryai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d juryai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voidrag-network
    restart: unless-stopped

  # Valkey (Redis-compatible) for caching, rate limiting, sessions
  valkey:
    image: valkey/valkey:8-alpine
    container_name: voidrag-valkey
    command: valkey-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - valkey_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voidrag-network
    restart: unless-stopped

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: voidrag-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant-config:/qdrant/config
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voidrag-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Quickwit for BM25/full-text search
  quickwit:
    image: quickwit/quickwit:0.8.0
    container_name: voidrag-quickwit
    command: run --config /quickwit-config/quickwit.yaml
    volumes:
      - quickwit_data:/quickwit
      - ./quickwit-config:/quickwit-config
    ports:
      - "7280:7280"
      - "7281:7281"
    environment:
      QW_CONFIG_FILE: /quickwit-config/quickwit.yaml
      QW_METASTORE_URI: file:///quickwit/qwmeta
      QW_INDEX_ROOT_URI: file:///quickwit/qwindex
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7280/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - voidrag-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Lightpanda for web scraping (headless browser)
  lightpanda:
    image: lightpanda/lightpanda:latest
    container_name: voidrag-lightpanda
    command: lightpanda --port 9222 --host 0.0.0.0
    ports:
      - "9222:9222"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9222/json/version"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - voidrag-network
    restart: unless-stopped

  # SpiceAI (Void-Space data engine) — federated SQL + NQL over the same
  # Postgres the backend uses; the backend's own auto-start in main.py
  # health-checks this URL first and no-ops when it finds this service up.
  spice:
    image: spiceai/spiceai:latest
    container_name: voidrag-spice
    environment:
      POSTGRES_PASSWORD: postgres
      GOOGLE_GEMINI_KEY: ${GOOGLE_GEMINI_KEY:-}
    volumes:
      - ./spicepod.yaml.template:/app/spicepod.yaml:ro
      - spice_data:/app/.spice
    working_dir: /app
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8090 && printf \"GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && read -r line <&3 && echo $$line | grep -q 200'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - voidrag-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voidrag-backend
    environment:
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: juryai
      POSTGRES_SCHEMA: juryai
      
      # Valkey
      VALKEY_URL: redis://valkey:6379/1
      
      # Qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: juryai_legal
      
      # Quickwit
      QUICKWIT_URL: http://quickwit:7280
      QUICKWIT_INDEX: juryai_legal
      
      # Lightpanda
      LIGHTPANDA_BINARY: lightpanda
      LIGHTPANDA_PORT: 9222
      WIGOLO_URL: http://lightpanda:9222
      
      # Models (will be downloaded on first run)
      EMBED_MODEL: nlpaueb/legal-bert-base-uncased
      RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L6-v2
      COLBERT_MODEL: colbert-ir/colbertv2.0
      
      # Feature flags
      HYDE_ENABLED: "true"
      OCR_ENABLED: "true"
      VERIFIER_GATE_ENABLED: "true"
      CLAIM_VERIFICATION_ENABLED: "true"
      
      # Retrieval settings
      TOP_K_RETRIEVE: 20
      TOP_K_FINAL: 10
      RERANKER_MAX_LENGTH: 512
      RERANKER_BATCH_SIZE: 8
      COLBERT_TOP_K: 50
      COLBERT_MAX_LENGTH: 180
      
      # Authority scoring
      AUTHORITY_SCORE_ALPHA: 0.50
      AUTHORITY_SCORE_BETA: 0.25
      AUTHORITY_SCORE_GAMMA: 0.15
      AUTHORITY_SCORE_DELTA: 0.10
      RECENCY_DECAY_LAMBDA: 0.05
      PAGERANK_DAMPING: 0.85
      
      # Evaluation
      EVAL_IOU_THRESHOLD: 0.5
      EVAL_TEXT_OVERLAP_THRESHOLD: 0.3
      
      # AWS/S3 (configure as needed)
      AWS_REGION: ap-south-1
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_BUCKET_NAMES: ${S3_BUCKET_NAMES:-}
      S3_DOCUMENT_PREFIX: ${S3_DOCUMENT_PREFIX:-}
      S3_BUCKET_PREFIXES: ${S3_BUCKET_PREFIXES:-}
      
      # LLM Gateway (optional)
      GATEWAY_URL: ${GATEWAY_URL:-http://host.docker.internal:8080/v1}
      GATEWAY_KEY: ${GATEWAY_KEY:-}
      GATEWAY_MODEL: llama-3.3-70b
      
      # Direct LLM providers (fallback)
      GOOGLE_GEMINI_KEY: ${GOOGLE_GEMINI_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Void-Space data engine (SpiceAI) — same Postgres as above, no duplicate infra
      SPICE_ENABLED: "true"
      SPICE_HTTP_URL: http://spice:8090
      SPICE_DATASET: juryai_legal
      SPICE_MODEL: nql
      SPICE_AUTO_INSTALL: "false"

      # Web search
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      WEB_SEARCH_MAX_RESULTS: 8
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-changeme-in-production}
      AUTH_DEV_RETURN_OTP: "true"
      
      # Python
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - model_cache:/root/.cache/huggingface
      - document_cache:/tmp/juryai-document-cache
      - session_store:/tmp/juryai-session-docs
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      quickwit:
        condition: service_healthy
      spice:
        condition: service_healthy
    networks:
      - voidrag-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 4G

volumes:
  postgres_data:
  valkey_data:
  qdrant_data:
  quickwit_data:
  spice_data:
  model_cache:
  document_cache:
  session_store:

networks:
  voidrag-network:
    driver: bridge